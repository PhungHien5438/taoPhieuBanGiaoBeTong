<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tool Xuất Phiếu Bê Tông (Fix Lỗi Undefined)</title>
    <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/pizzip@3.1.4/dist/pizzip.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/docxtemplater@3.37.11/build/docxtemplater.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/file-saver@2.0.5/dist/FileSaver.min.js"></script>
    <style>
        :root {
            --primary: #1976D2;
            --primary-hover: #1565C0;
            --bg: #f4f6f9;
            --card: #ffffff;
            --border: #dce1e7;
            --text: #2c3e50;
        }
        * { box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body {
            background-color: var(--bg);
            color: var(--text);
            margin: 0;
            padding: 30px 15px;
            display: flex;
            justify-content: center;
        }
        .container {
            background: var(--card);
            width: 100%;
            max-width: 680px;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.08);
        }
        h2 {
            margin-top: 0;
            text-align: center;
            color: var(--primary);
            border-bottom: 2px solid #eef2f7;
            padding-bottom: 15px;
        }
        .form-group { margin-bottom: 20px; }
        label {
            display: block;
            font-weight: 600;
            margin-bottom: 8px;
            font-size: 14px;
        }
        input[type="file"], input[type="number"] {
            width: 100%;
            padding: 10px 12px;
            border: 1px solid var(--border);
            border-radius: 6px;
            font-size: 14px;
            background: #fafbfc;
        }
        input[type="file"] { cursor: pointer; }
        .row-range {
            display: flex;
            gap: 15px;
            align-items: center;
        }
        .row-range > div { flex: 1; }
        .btn {
            background-color: var(--primary);
            color: white;
            border: none;
            padding: 14px;
            border-radius: 6px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s;
            width: 100%;
            margin-top: 10px;
        }
        .btn:hover { background-color: var(--primary-hover); }
        .note {
            font-size: 12.5px;
            color: #666;
            margin-top: 5px;
        }
        #status {
            margin-top: 20px;
            padding: 12px;
            border-radius: 6px;
            display: none;
            font-size: 14px;
            line-height: 1.5;
            white-space: pre-line;
        }
        .success { background: #e8f5e9; color: #2e7d32; border: 1px solid #c8e6c9; }
        .error { background: #ffebee; color: #c62828; border: 1px solid #ffcdd2; }
        .info { background: #e3f2fd; color: #1565c0; border: 1px solid #bbdefb; }
    </style>
</head>
<body>

<div class="container">
    <h2>XUẤT PHIẾU BÊ TÔNG (BẢN FIX)</h2>

    <div class="form-group">
        <label>1. Chọn file Word mẫu (.docx):</label>
        <input type="file" id="wordFile" accept=".docx">
        <div class="note">* Đảm bảo các biến trong Word khớp hoàn toàn với tên cột Excel (Ví dụ: <b>{tramSo}</b>, <b>{soPhieu}</b>).</div>
    </div>

    <div class="form-group">
        <label>2. Chọn file dữ liệu Excel (.xlsx, .xls):</label>
        <input type="file" id="excelFile" accept=".xlsx, .xls">
        <div class="note" id="excelInfo">* Dòng 1 của file Excel phải chứa tên các biến.</div>
    </div>

    <div class="form-group">
        <label>3. Chọn khoảng dòng dữ liệu cần xuất:</label>
        <div class="row-range">
            <div>
                <span class="note">Từ dòng số:</span>
                <input type="number" id="startRow" value="2" min="2">
            </div>
            <div>
                <span class="note">Đến dòng số:</span>
                <input type="number" id="endRow" value="2" min="2">
            </div>
        </div>
    </div>

    <button type="button" class="btn" id="btnExport">GỘP VÀ XUẤT 1 FILE WORD DUY NHẤT</button>

    <div id="status"></div>
</div>

<script>
    let excelRows = [];

    document.getElementById('excelFile').addEventListener('change', async function(e) {
        const file = e.target.files[0];
        if (!file) return;
        try {
            const data = await file.arrayBuffer();
            const workbook = XLSX.read(data, { type: 'array', cellDates: true });
            const firstSheet = workbook.Sheets[workbook.SheetNames[0]];
            excelRows = XLSX.utils.sheet_to_json(firstSheet, { header: 1, defval: "" });
            
            const totalRows = excelRows.length;
            const headers = excelRows[0] ? excelRows[0].map(h => String(h).trim()).filter(h => h) : [];
            
            document.getElementById('excelInfo').innerHTML = 
                `✅ Đã đọc file: <b>${file.name}</b> (Tổng ${totalRows} dòng).<br>` +
                `<span style="color: #2e7d32;">Các cột nhận diện được: <b>${headers.join(", ")}</b></span>`;
            
            if (totalRows >= 2) {
                document.getElementById('endRow').value = totalRows;
            }
        } catch (err) {
            showStatus("Lỗi đọc file Excel: " + err.message, "error");
        }
    });

    function formatCellValue(val) {
        if (val === null || val === undefined) return "";
        if (val instanceof Date) {
            if (val.getFullYear() <= 1900) {
                const hh = String(val.getHours()).padStart(2, '0');
                const mm = String(val.getMinutes()).padStart(2, '0');
                return `${hh}:${mm}`;
            }
            const dd = String(val.getDate()).padStart(2, '0');
            const mm = String(val.getMonth() + 1).padStart(2, '0');
            const yyyy = val.getFullYear();
            return `${dd}/${mm}/${yyyy}`;
        }
        return String(val).trim();
    }

    function showStatus(msg, type) {
        const statusEl = document.getElementById('status');
        statusEl.className = type;
        statusEl.innerHTML = msg;
        statusEl.style.display = 'block';
    }

    document.getElementById('btnExport').addEventListener('click', async () => {
        const wordFile = document.getElementById('wordFile').files[0];
        const excelFile = document.getElementById('excelFile').files[0];
        const startRow = parseInt(document.getElementById('startRow').value);
        const endRow = parseInt(document.getElementById('endRow').value);

        if (!wordFile || !excelFile) {
            showStatus("⚠️ Vui lòng chọn đầy đủ cả File Word mẫu và File dữ liệu Excel!", "error");
            return;
        }
        if (isNaN(startRow) || isNaN(endRow) || startRow < 2 || endRow < startRow) {
            showStatus("⚠️ Khoảng dòng không hợp lệ!", "error");
            return;
        }

        showStatus("⏳ Đang tổng hợp dữ liệu, vui lòng đợi...", "info");

        try {
            const wordArrayBuffer = await wordFile.arrayBuffer();
            // Làm sạch tên cột (bỏ khoảng trắng thừa)
            const headers = excelRows[0].map(h => String(h).trim());
            const maxRow = Math.min(endRow, excelRows.length);
            
            let combinedBody = "";
            let count = 0;

            for (let r = startRow - 1; r < maxRow; r++) {
                const rowData = excelRows[r];
                if (!rowData || rowData.every(cell => cell === "")) continue;

                const context = {};
                headers.forEach((h, idx) => {
                    if (h) {
                        context[h] = formatCellValue(rowData[idx]);
                    }
                });

                const pizzip = new PizZip(wordArrayBuffer);
                const docItem = new window.docxtemplater(pizzip, {
                    paragraphLoop: true,
                    linebreaks: true,
                    delimiters: { start: '{', end: '}' }
                });

                docItem.render(context);
                
                let zipOutput = docItem.getZip();
                let docXml = zipOutput.file("word/document.xml").asText();
                
                let bodyMatch = docXml.match(/<w:body[^>]*>([\s\S]*)<\/w:body>/);
                if (bodyMatch) {
                    combinedBody += bodyMatch[1];
                    if (r < maxRow - 1) {
                        combinedBody += '<w:p><w:r><w:br w:type="page"/></w:r></w:p>'; // Ngắt trang giữa các phiếu
                    }
                }
                count++;
            }

            if (count === 0) {
                showStatus("⚠️ Không tìm thấy dữ liệu trong khoảng dòng đã chọn.", "error");
                return;
            }

            const baseZip = new PizZip(wordArrayBuffer);
            let baseDocumentXml = baseZip.file("word/document.xml").asText();
            let finalXml = baseDocumentXml.replace(/(<w:body[^>]*>)([\s\S]*)(<\/w:body>)/, `$1${combinedBody}$3`);
            
            baseZip.file("word/document.xml", finalXml);
            const finalBlob = baseZip.generate({ type: "blob", mimeType: "application/vnd.openxmlformats-officedocument.wordprocessingml.document" });
            
            saveAs(finalBlob, `Phieu_Be_Tong_Gop_${startRow}_den_${maxRow}.docx`);
            showStatus(`✅ Thành công! Đã gộp thành công ${count} phiếu vào 1 file Word duy nhất (mỗi phiếu 1 trang).`, "success");

        } catch (ex) {
            console.error(ex);
            showStatus("❌ Lỗi xử lý: " + ex.message + "\n\n💡 Mẹo: Hãy kiểm tra lại file Word mẫu xem các thẻ {tramSo}, {soPhieu}... có bị lỗi định dạng ẩn trong Word hay không.", "error");
        }
    });
</script>

</body>
</html>
