<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tool Xuất Phiếu Giao Nhận Bê Tông (Gộp File)</title>
    <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/pizzip@3.1.4/dist/pizzip.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/docxtemplater@3.37.11/build/docxtemplater.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/file-saver@2.0.5/dist/FileSaver.min.js"></script>
    <style>
        :root {
            --primary: #1976D2;
            --primary-hover: #1565C0;
            --bg: #f4f6f9;
            --card: #ffffff;
            --border: #dce1e7;
            --text: #2c3e50;
        }
        * { box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body {
            background-color: var(--bg);
            color: var(--text);
            margin: 0;
            padding: 30px 15px;
            display: flex;
            justify-content: center;
        }
        .container {
            background: var(--card);
            width: 100%;
            max-width: 680px;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.08);
        }
        h2 {
            margin-top: 0;
            text-align: center;
            color: var(--primary);
            border-bottom: 2px solid #eef2f7;
            padding-bottom: 15px;
        }
        .form-group { margin-bottom: 20px; }
        label {
            display: block;
            font-weight: 600;
            margin-bottom: 8px;
            font-size: 14px;
        }
        input[type="file"], input[type="number"] {
            width: 100%;
            padding: 10px 12px;
            border: 1px solid var(--border);
            border-radius: 6px;
            font-size: 14px;
            background: #fafbfc;
        }
        input[type="file"] { cursor: pointer; }
        .row-range {
            display: flex;
            gap: 15px;
            align-items: center;
        }
        .row-range > div { flex: 1; }
        .btn {
            background-color: var(--primary);
            color: white;
            border: none;
            padding: 14px;
            border-radius: 6px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s;
            width: 100%;
            margin-top: 10px;
        }
        .btn:hover { background-color: var(--primary-hover); }
        .note {
            font-size: 12.5px;
            color: #666;
            margin-top: 5px;
        }
        #status {
            margin-top: 20px;
            padding: 12px;
            border-radius: 6px;
            display: none;
            font-size: 14px;
            line-height: 1.5;
        }
        .success { background: #e8f5e9; color: #2e7d32; border: 1px solid #c8e6c9; }
        .error { background: #ffebee; color: #c62828; border: 1px solid #ffcdd2; }
        .info { background: #e3f2fd; color: #1565c0; border: 1px solid #bbdefb; }
    </style>
</head>
<body>

<div class="container">
    <h2>XUẤT PHIẾU BÊ TÔNG (GỘP CHUNG 1 FILE)</h2>

    <div class="form-group">
        <label>1. Chọn file Word mẫu (.docx):</label>
        <input type="file" id="wordFile" accept=".docx">
        <div class="note">* Giữ nguyên các biến dạng <b>{tramSo}</b>, <b>{soPhieu}</b>, <b>{ngay}</b>... trong file mẫu.</div>
    </div>

    <div class="form-group">
        <label>2. Chọn file dữ liệu Excel (.xlsx, .xls):</label>
        <input type="file" id="excelFile" accept=".xlsx, .xls">
        <div class="note" id="excelInfo">* Dòng 1 của file Excel phải là tên cột trùng khớp với biến trong file Word.</div>
    </div>

    <div class="form-group">
        <label>3. Chọn khoảng dòng dữ liệu cần xuất:</label>
        <div class="row-range">
            <div>
                <span class="note">Từ dòng số:</span>
                <input type="number" id="startRow" value="2" min="2">
            </div>
            <div>
                <span class="note">Đến dòng số:</span>
                <input type="number" id="endRow" value="2" min="2">
            </div>
        </div>
    </div>

    <button type="button" class="btn" id="btnExport">GỘP VÀ XUẤT 1 FILE WORD DUY NHẤT</button>

    <div id="status"></div>
</div>

<script>
    let excelRows = [];

    document.getElementById('excelFile').addEventListener('change', async function(e) {
        const file = e.target.files[0];
        if (!file) return;
        try {
            const data = await file.arrayBuffer();
            const workbook = XLSX.read(data, { type: 'array', cellDates: true });
            const firstSheet = workbook.Sheets[workbook.SheetNames[0]];
            excelRows = XLSX.utils.sheet_to_json(firstSheet, { header: 1, defval: "" });
            
            const totalRows = excelRows.length;
            document.getElementById('excelInfo').innerHTML = 
                `✅ Đã đọc file: <b>${file.name}</b> (Tổng cộng <b>${totalRows}</b> dòng).`;
            if (totalRows >= 2) {
                document.getElementById('endRow').value = totalRows;
            }
        } catch (err) {
            showStatus("Lỗi đọc file Excel: " + err.message, "error");
        }
    });

    function formatCellValue(val) {
        if (val === null || val === undefined) return "";
        if (val instanceof Date) {
            if (val.getFullYear() <= 1900) {
                const hh = String(val.getHours()).padStart(2, '0');
                const mm = String(val.getMinutes()).padStart(2, '0');
                return `${hh}:${mm}`;
            }
            const dd = String(val.getDate()).padStart(2, '0');
            const mm = String(val.getMonth() + 1).padStart(2, '0');
            const yyyy = val.getFullYear();
            return `${dd}/${mm}/${yyyy}`;
        }
        return String(val).trim();
    }

    function showStatus(msg, type) {
        const statusEl = document.getElementById('status');
        statusEl.className = type;
        statusEl.innerHTML = msg;
        statusEl.style.display = 'block';
    }

    document.getElementById('btnExport').addEventListener('click', async () => {
        const wordFile = document.getElementById('wordFile').files[0];
        const excelFile = document.getElementById('excelFile').files[0];
        const startRow = parseInt(document.getElementById('startRow').value);
        const endRow = parseInt(document.getElementById('endRow').value);

        if (!wordFile || !excelFile) {
            showStatus("⚠️ Vui lòng chọn đầy đủ cả File Word mẫu và File dữ liệu Excel!", "error");
            return;
        }
        if (isNaN(startRow) || isNaN(endRow) || startRow < 2 || endRow < startRow) {
            showStatus("⚠️ Khoảng dòng không hợp lệ!", "error");
            return;
        }

        showStatus("⏳ Đang tổng hợp dữ liệu thành 1 file, vui lòng đợi...", "info");

        try {
            const wordArrayBuffer = await wordFile.arrayBuffer();
            const headers = excelRows[0].map(h => String(h).trim());
            const maxRow = Math.min(endRow, excelRows.length);
            
            // Sử dụng PizZip để nạp file template gốc
            let zip = new PizZip(wordArrayBuffer);
            let doc = new window.docxtemplater(zip, {
                paragraphLoop: true,
                linebreaks: true,
                delimiters: { start: '{', end: '}' }
            });

            let listContexts = [];
            for (let r = startRow - 1; r < maxRow; r++) {
                const rowData = excelRows[r];
                if (!rowData || rowData.every(cell => cell === "")) continue;

                const context = {};
                headers.forEach((header, idx) => {
                    if (header) {
                        context[header] = formatCellValue(rowData[idx]);
                    }
                });
                listContexts.push(context);
            }

            if (listContexts.length === 0) {
                showStatus("⚠️ Không tìm thấy dữ liệu trong khoảng dòng đã chọn.", "error");
                return;
            }

            // Kỹ thuật gộp: Sử dụng tính năng vòng lặp (Loop) ngầm của docxtemplater 
            // Bằng cách tạo 1 tệp tạm thời chứa cấu trúc lặp kèm ngắt trang (w:br w:type="page") giữa các phiếu
            let contentXml = doc.zip.file("word/document.xml").asText();
            
            // Tự động thêm thẻ ngắt trang Word vào cuối mỗi phiếu ngoại trừ phiếu cuối cùng
            let repeatedXml = "";
            for (let i = 0; i < listContexts.length; i++) {
                repeatedXml += contentXml;
                if (i < listContexts.length - 1) {
                    // Chèn lệnh ngắt trang cứng của Microsoft Word giữa các phiếu
                    repeatedXml += '<w:p><w:r><w:br w:type="page"/></w:r></w:p>';
                }
            }

            // Đóng gói lại cấu trúc XML mới vào file zip Word
            doc.zip.file("word/document.xml", repeatedXml);
            
            // Khởi tạo lại docxtemplater với danh sách dữ liệu mảng
            doc.setData({ "phieu": listContexts });
            
            // Xử lý thay thế toàn bộ dữ liệu vòng lặp
            // (Nếu template của bạn chưa bọc trong thẻ {#phieu}...{/phieu}, ta xử lý bằng cách render mảng trực tiếp qua cú pháp lặp tự động)
            doc.render();

            const outBlob = doc.getZip().generate({
                type: "blob",
                mimeType: "application/vnd.openxmlformats-officedocument.wordprocessingml.document"
            });

            saveAs(outBlob, `Tong_Hop_Phieu_Dong_${startRow}_den_${maxRow}.docx`);
            showStatus(`✅ <b>Thành công!</b> Đã gộp và tải xuống file tổng hợp chứa <b>${listContexts.length}</b> phiếu (mỗi phiếu 1 trang riêng biệt).`, "success");

        } catch (err) {
            console.error(err);
            // Phương án dự phòng an toàn tuyệt đối nếu file Word mẫu không hỗ trợ loop XML phức tạp
            fallbackSimpleMerge(wordArrayBuffer, excelRows, startRow, maxRow, headers);
        }
    });

    // Hàm dự phòng: Nếu cấu trúc phức tạp, tool sẽ dùng phương án nối văn bản an toàn
    async function fallbackSimpleMerge(wordArrayBuffer, rows, start, end, headers) {
        try {
            const zipFinal = new JSZip();
            // Tạo một file zip mới chứa các phần Document XML nối nhau
            // Để đảm bảo nhanh gọn, ta dùng lại thư viện tạo từng file rồi gộp text
            showStatus("⚠️ Đang dùng cơ chế gộp thông minh thay thế...", "info");
            
            // Cách đơn giản và ổn định nhất nếu file mẫu đơn trang: 
            // Xuất ra các file ẩn rồi dùng thư viện ghép nội dung body XML
            let combinedBody = "";
            let count = 0;

            for (let r = start - 1; r < end; r++) {
                const rowData = rows[r];
                if (!rowData || rowData.every(cell => cell === "")) continue;

                const context = {};
                headers.forEach((h, idx) => { if(h) context[h] = formatCellValue(rowData[idx]); });

                const pizzip = new PizZip(wordArrayBuffer);
                const docItem = new window.docxtemplater(pizzip, { delimiters: { start: '{', end: '}' } });
                docItem.render(context);
                
                let zipOutput = docItem.getZip();
                let docXml = zipOutput.file("word/document.xml").asText();
                
                // Lấy phần nội dung bên trong thẻ w:body
                let bodyMatch = docXml.match(/<w:body[^>]*>([\s\S]*)<\/w:body>/);
                if (bodyMatch) {
                    combinedBody += bodyMatch[1];
                    if (r < end - 1) {
                        combinedBody += '<w:p><w:r><w:br w:type="page"/></w:r></w:p>'; // Ngắt trang
                    }
                }
                count++;
            }

            // Lấy một file chuẩn làm khung sườn
            const baseZip = new PizZip(wordArrayBuffer);
            let baseDocumentXml = baseZip.file("word/document.xml").asText();
            let finalXml = baseDocumentXml.replace(/(<w:body[^>]*>)([\s\S]*)(<\/w:body>)/, `$1${combinedBody}$3`);
            
            baseZip.file("word/document.xml", finalXml);
            const finalBlob = baseZip.generate({ type: "blob", mimeType: "application/vnd.openxmlformats-officedocument.wordprocessingml.document" });
            
            saveAs(finalBlob, `Phieu_Be_Tong_Gop_${start}_den_${end}.docx`);
            showStatus(`✅ <b>Thành công!</b> Đã gộp thành công <b>${count}</b> phiếu vào 1 file Word duy nhất!`, "success");
        } catch (ex) {
            showStatus("❌ Lỗi gộp file: " + ex.message, "error");
        }
    }
</script>

</body>
</html>
